<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EVA Systems, LLC — EVA Framework</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Simplified EVA single-page framework for Earth, Frontier, and Moon environments." />
  <style>
    :root {
      --bg: #050608;
      --bg-soft: #0b0e13;
      --text: #f5f7fa;
      --muted: #9aa0b5;
      --silver: #c8cfdb;
      --accent: #4fb3ff;
      --border: #1b2230;
      --max-width: 1120px;
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      min-height: 100vh;
      background: linear-gradient(140deg, #0a0d15 0%, #050608 42%, #090b11 100%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding: 18px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(79, 179, 255, 0.08), transparent 42%),
        radial-gradient(circle at 75% 80%, rgba(200, 207, 219, 0.05), transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    .page-header {
      width: min(100%, var(--max-width));
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body:not(.landing-focus) .page-header {
      display: none;
    }

    .page-badge {
      display: inline-block;
      margin: 0;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.06);
      color: #d7dce8;
      text-transform: uppercase;
      font-size: 0.86rem;
      letter-spacing: 0.18em;
      font-weight: 620;
      padding: 9px 16px;
      backdrop-filter: blur(6px);
    }

    .page-subtitle {
      color: rgba(200, 207, 219, 0.85);
      font-size: 1.56rem;
      letter-spacing: 0.02em;
      line-height: 1.35;
      margin: 0;
    }

    body.landing-focus .page-header {
      row-gap: 0;
      margin-bottom: 0;
    }

    body.landing-focus .page-subtitle {
      margin: 0 auto;
      width: min(100%, 920px);
      min-height: 72px;
      display: grid;
      place-items: center;
      text-align: center;
      transform: translateY(38px);
    }

    .app-shell {
      width: min(100%, var(--max-width));
      margin: 0 auto;
    }

    body.landing-focus {
      display: grid;
      place-items: center;
      padding: 14px;
    }

    body.landing-focus .app-shell {
      width: min(100%, 1220px);
    }

    body.landing-focus .top-nav {
      display: none;
    }

    body.landing-focus .panel {
      padding: 0 40px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 520px;
    }

    body.landing-focus .select-grid {
      width: min(100%, 1060px);
      gap: 18px;
      margin: 0;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(7, 10, 18, 0.75);
      backdrop-filter: blur(8px);
    }

    .brand {
      font-size: 0.76rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--silver);
      white-space: nowrap;
    }

    .nav-items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .nav-btn {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(15, 20, 30, 0.72);
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 7px 11px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .nav-btn:hover,
    .nav-btn.is-active {
      border-color: rgba(79, 179, 255, 0.45);
      color: var(--text);
      box-shadow: 0 0 14px rgba(79, 179, 255, 0.2);
    }

    .panel {
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(160deg, rgba(10, 14, 22, 0.95) 0%, rgba(5, 6, 8, 0.98) 70%);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
      padding: 34px 28px;
      overflow: hidden;
      position: relative;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: -35%;
      right: -15%;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 179, 255, 0.08), transparent 70%);
      pointer-events: none;
    }

    .kicker {
      display: inline-block;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--silver);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 6px 11px;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.04);
    }

    .hero-title {
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      line-height: 1.2;
      margin-bottom: 10px;
      letter-spacing: 0.03em;
    }

    .hero-sub {
      color: var(--muted);
      max-width: 50rem;
      margin-bottom: 24px;
      font-size: 0.98rem;
    }

    .landing-kicker {
      display: block;
      width: fit-content;
      margin: 0 auto 28px;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.06);
      color: #d7dce8;
      text-transform: uppercase;
      font-weight: 620;
    }

    .select-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: 0 auto;
      width: min(100%, 980px);
    }

    .select-card {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(160deg, rgba(18, 24, 35, 0.9) 0%, rgba(6, 8, 12, 0.95) 100%);
      padding: 14px 14px 16px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .select-card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: rgba(79, 179, 255, 0.38);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45), 0 0 24px rgba(79, 179, 255, 0.16);
    }

    .select-visual {
      height: 182px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #070a11 0%, #020409 70%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04), inset 0 -35px 60px rgba(64, 93, 130, 0.22);
    }

    .select-visual--earth::before {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 0;
      height: 64px;
      background:
        linear-gradient(180deg, rgba(205, 216, 232, 0.92) 0%, rgba(107, 128, 157, 0.52) 58%, rgba(25, 43, 74, 0.78) 100%),
        repeating-linear-gradient(90deg, rgba(196, 213, 233, 0.38) 0 2px, transparent 2px 10px);
      clip-path: polygon(0 100%, 0 68%, 10% 68%, 10% 44%, 22% 44%, 22% 13%, 34% 13%, 34% 56%, 46% 56%, 46% 24%, 58% 24%, 58% 58%, 70% 58%, 70% 30%, 82% 30%, 82% 64%, 92% 64%, 92% 22%, 100% 22%, 100% 100%);
      border-top: 1px solid rgba(204, 219, 238, 0.45);
      z-index: 2;
    }

    .select-visual--earth::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50px;
      background:
        radial-gradient(circle at 50% 108%, rgba(79, 179, 255, 0.5), transparent 55%),
        linear-gradient(180deg, rgba(25, 42, 74, 0.16), rgba(25, 42, 74, 0.82));
      z-index: 1;
    }

    .select-visual-earth-light {
      position: absolute;
      width: 2px;
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(233, 245, 255, 0.95), rgba(79, 179, 255, 0.45));
      box-shadow: 0 0 8px rgba(79, 179, 255, 0.45);
      z-index: 3;
    }

    .select-visual--frontier {
      background: linear-gradient(180deg, #06080f 0%, #03050a 60%);
    }

    .select-visual--frontier::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 108%, rgba(255, 179, 71, 0.5), transparent 52%);
    }

    .select-visual--frontier::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42px;
      background: linear-gradient(180deg, rgba(197, 205, 220, 0.28), rgba(114, 122, 136, 0.32));
      clip-path: polygon(0 100%, 0 60%, 15% 48%, 32% 44%, 50% 51%, 67% 46%, 84% 52%, 100% 58%, 100% 100%);
    }

    .select-visual-spike {
      position: absolute;
      bottom: 42px;
      width: 2px;
      background: linear-gradient(180deg, rgba(220, 228, 236, 0.95), rgba(105, 114, 126, 0.15));
      box-shadow: 0 0 8px rgba(255, 179, 71, 0.35);
      z-index: 2;
    }

    .select-visual-spike::after {
      content: "";
      position: absolute;
      top: -3px;
      left: -1px;
      width: 4px;
      height: 2px;
      background: rgba(240, 245, 252, 0.75);
    }

    .select-visual--moon {
      background: radial-gradient(circle at 76% -8%, rgba(255, 255, 255, 0.12), transparent 42%), #03050a;
    }

    .select-visual--moon::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 76px;
      background:
        linear-gradient(180deg, rgba(242, 246, 255, 0.96), rgba(173, 184, 202, 0.82) 58%, rgba(118, 129, 146, 0.8) 100%),
        radial-gradient(circle at 52% 10%, rgba(255, 255, 255, 0.42), transparent 58%);
      clip-path: polygon(0 100%, 0 58%, 10% 34%, 22% 50%, 38% 26%, 52% 44%, 64% 32%, 78% 52%, 90% 38%, 100% 48%, 100% 100%);
      box-shadow: 0 -8px 22px rgba(210, 224, 250, 0.35), 0 0 24px rgba(182, 201, 238, 0.22);
    }

    .select-visual--moon::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24px;
      height: 64px;
      background:
        radial-gradient(circle at 50% 80%, rgba(197, 217, 255, 0.34), transparent 58%),
        radial-gradient(circle at 28% 84%, rgba(255, 255, 255, 0.2), transparent 48%);
      pointer-events: none;
      z-index: 1;
    }

    .select-visual-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, rgba(160, 174, 194, 0.75));
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.24);
      z-index: 2;
    }

    .select-visual-dot.small {
      width: 10px;
      height: 10px;
      opacity: 0.88;
    }

    .select-visual-star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(228, 236, 250, 0.86);
      box-shadow: 0 0 6px rgba(206, 220, 245, 0.34);
      z-index: 1;
    }

    .select-phase {
      font-size: 0.64rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .select-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .select-status {
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .select-card-copy {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .card {
      border-radius: 15px;
      border: 1px solid var(--border);
      background: linear-gradient(160deg, rgba(18, 24, 35, 0.92), rgba(6, 8, 12, 0.95));
      padding: 14px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: scale(1.018);
      border-color: rgba(79, 179, 255, 0.5);
      box-shadow: 0 0 26px rgba(79, 179, 255, 0.18), 0 12px 28px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 1.06rem;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .card-copy {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .mini-visual {
      height: 118px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      position: relative;
      overflow: hidden;
      background: #070a11;
    }

    .mini-earth::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(90deg, rgba(79, 179, 255, 0.25) 0 2px, transparent 2px 12px),
        linear-gradient(180deg, rgba(6, 10, 18, 0.55), rgba(18, 35, 66, 0.85));
      transform: perspective(160px) rotateX(44deg) translateY(20px);
      transform-origin: bottom;
    }

    .mini-frontier::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 110%, rgba(255, 182, 82, 0.45), transparent 54%);
    }

    .mini-frontier::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42px;
      background: linear-gradient(180deg, rgba(201, 209, 223, 0.35), rgba(96, 105, 121, 0.26));
      clip-path: polygon(0 100%, 0 60%, 18% 44%, 36% 54%, 55% 46%, 74% 58%, 100% 50%, 100% 100%);
    }

    .mini-moon {
      background: radial-gradient(circle at 80% -10%, rgba(228, 235, 247, 0.18), transparent 38%), #05070d;
    }

    .mini-moon::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 52px;
      background: linear-gradient(180deg, rgba(239, 244, 252, 0.94), rgba(147, 157, 173, 0.76));
      clip-path: polygon(0 100%, 0 58%, 11% 34%, 24% 50%, 40% 30%, 56% 46%, 71% 34%, 87% 56%, 100% 44%, 100% 100%);
      box-shadow: 0 -6px 14px rgba(198, 212, 242, 0.28);
    }

    .cta-line {
      color: var(--silver);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .btn-primary {
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #03050a;
      padding: 10px 18px;
      background: linear-gradient(135deg, #cfd5e0 0%, #4fb3ff 100%);
      box-shadow: 0 10px 24px rgba(79, 179, 255, 0.3);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(79, 179, 255, 0.42);
    }

    body.landing-focus .hero-title,
    body.landing-focus .hero-sub,
    body.landing-focus .cta-line {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
    }

    body.landing-focus .hero-title {
      color: rgba(245, 247, 250, 0.94);
    }

    body.landing-focus .hero-sub {
      max-width: 44rem;
      margin-bottom: 30px;
      color: rgba(154, 160, 181, 0.82);
    }

    body.landing-focus .cta-line {
      color: rgba(200, 207, 219, 0.78);
    }

    @keyframes tile-reveal {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    body.landing-focus .select-card {
      opacity: 0;
      animation: tile-reveal 0.5s ease forwards;
    }

    body.landing-focus .select-card:nth-child(1) {
      animation-delay: 0.03s;
    }

    body.landing-focus .select-card:nth-child(2) {
      animation-delay: 0.11s;
    }

    body.landing-focus .select-card:nth-child(3) {
      animation-delay: 0.19s;
    }

    .view {
      animation: fade-in 0.28s ease;
      position: relative;
      z-index: 1;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cinematic-header {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      background: linear-gradient(140deg, rgba(13, 18, 29, 0.86), rgba(4, 6, 10, 0.96));
      position: relative;
      overflow: hidden;
    }

    .cinematic-header--with-thumb {
      padding-right: 214px;
      min-height: 190px;
    }

    .env-header-thumb {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 176px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.46);
      background: rgba(255, 255, 255, 0.04);
    }

    .cinematic-title {
      font-size: clamp(1.4rem, 2.3vw, 2rem);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .cinematic-sub {
      color: var(--silver);
      font-size: 0.95rem;
      max-width: 48rem;
    }

    .env-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.3fr);
      gap: 14px;
    }

    .env-preview-card {
      cursor: default;
      padding: 12px;
    }

    .env-preview-card:hover {
      transform: none;
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: none;
    }

    .env-preview-card .select-visual {
      height: 260px;
      margin-bottom: 0;
    }

    .motif {
      border-radius: 14px;
      border: 1px solid var(--border);
      min-height: 240px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(160deg, rgba(16, 22, 34, 0.85), rgba(5, 8, 13, 0.95));
    }

    .motif.earth::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(79, 179, 255, 0.2) 0 1px, transparent 1px 16px),
        repeating-linear-gradient(90deg, rgba(79, 179, 255, 0.2) 0 1px, transparent 1px 16px);
      transform: perspective(220px) rotateX(58deg) translateY(30px);
      transform-origin: bottom;
    }

    .motif.frontier::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 112%, rgba(255, 179, 71, 0.45), transparent 52%);
    }

    .motif.frontier::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60px;
      background: linear-gradient(180deg, rgba(201, 210, 226, 0.34), rgba(108, 117, 132, 0.32));
      clip-path: polygon(0 100%, 0 60%, 16% 44%, 34% 54%, 54% 46%, 72% 58%, 86% 52%, 100% 64%, 100% 100%);
    }

    .motif.moon {
      background: radial-gradient(circle at 78% -12%, rgba(230, 236, 248, 0.2), transparent 40%), #06080f;
    }

    .motif.moon::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 88px;
      background: linear-gradient(180deg, rgba(241, 245, 254, 0.96), rgba(155, 166, 184, 0.78));
      clip-path: polygon(0 100%, 0 56%, 10% 35%, 22% 52%, 36% 30%, 50% 45%, 62% 34%, 78% 56%, 90% 42%, 100% 50%, 100% 100%);
      box-shadow: 0 -8px 20px rgba(200, 213, 238, 0.32);
    }

    .structured-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .structured-item {
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 12px;
      background: linear-gradient(145deg, rgba(22, 29, 42, 0.7), rgba(8, 12, 18, 0.88));
    }

    .structured-label {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--silver);
      margin-bottom: 6px;
    }

    .structured-copy {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .diagram-placeholder {
      border-radius: 14px;
      border: 1px dashed rgba(200, 207, 219, 0.5);
      min-height: 220px;
      display: grid;
      place-items: center;
      color: var(--silver);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.78rem;
      background: linear-gradient(160deg, rgba(13, 18, 29, 0.75), rgba(7, 10, 16, 0.92));
      margin-bottom: 14px;
    }

    .arch-list,
    .founder-bio,
    .contact-copy {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.62;
      max-width: 56rem;
    }

    .progression {
      margin: 16px 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      position: relative;
    }

    .progression::before {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      top: 18px;
      height: 2px;
      background: linear-gradient(90deg, rgba(79, 179, 255, 0.3), rgba(200, 207, 219, 0.7), rgba(79, 179, 255, 0.3));
      z-index: 0;
    }

    .step {
      z-index: 1;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 14px 12px;
      background: linear-gradient(150deg, rgba(19, 25, 38, 0.82), rgba(6, 8, 12, 0.92));
    }

    .step-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--silver), var(--accent));
      box-shadow: 0 0 10px rgba(79, 179, 255, 0.5);
      margin-bottom: 10px;
    }

    .step-title {
      font-size: 0.88rem;
      margin-bottom: 6px;
      color: var(--text);
      letter-spacing: 0.04em;
    }

    .step-copy {
      color: var(--muted);
      font-size: 0.83rem;
      line-height: 1.45;
    }

    .section-actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      border-radius: 999px;
      border: 1px solid rgba(200, 207, 219, 0.45);
      background: transparent;
      color: var(--silver);
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 9px 14px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .cinematic-header--with-thumb {
        padding-right: 20px;
        min-height: 0;
      }

      .env-header-thumb {
        position: static;
        display: block;
        width: min(100%, 260px);
        margin: 12px 0 0 auto;
      }

      .env-layout {
        grid-template-columns: 1fr;
      }

      .select-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .structured-grid,
      .progression {
        grid-template-columns: 1fr;
      }

      .progression::before {
        display: none;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 10px;
      }

      .page-badge {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        padding: 7px 12px;
      }

      .page-subtitle {
        font-size: 1.36rem;
      }

      body.landing-focus .page-header {
        row-gap: 0;
        margin-bottom: 0;
      }

      body.landing-focus .page-subtitle {
        min-height: 56px;
      }

      body.landing-focus .panel {
        padding: 0 16px 24px;
        min-height: 0;
      }

      .panel {
        padding: 22px 16px;
      }

      .select-grid {
        grid-template-columns: 1fr;
      }

      .select-visual {
        height: 150px;
      }

      .env-preview-card .select-visual {
        height: 190px;
      }

      .top-nav {
        border-radius: 16px;
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <div class="page-badge">EVA Systems, LLC</div>
    <p class="page-subtitle">Autonomous retail and supply infrastructure.</p>
  </div>
  <main id="app" class="app-shell"></main>

  <script>
    // SPA component-style layout functions
    const ENVIRONMENTS = {
      earth: {
        title: "EVA Earth",
        description: "Retail and supply infrastructure for today's built environment.",
        problem: "Dense logistics still depend on manual movement across multifamily, retail, and campus routes. Short loops create labor friction and inconsistent service windows. Operators lack precise local orchestration for constant demand variability.",
        icp: "Operators running high-frequency, short-range logistics in structured environments. Teams focused on throughput, repeatability, and controlled deployment geography.",
        insight: "High-density corridors reward automation first. Removing repetitive manual movement unlocks better service reliability and higher daily operational throughput.",
        solution: "EVA Earth coordinates autonomous units, supply nodes, and terrestrial routing into one control loop. The result is faster fulfillment, cleaner telemetry, and lower motion cost per order.",
        motif: "earth"
      },
      frontier: {
        title: "EVA Frontier",
        description: "Retail and supply infrastructure for remote and underserved regions.",
        problem: "Remote pads and corridors face sparse infrastructure, dangerous movement, and limited inventory visibility. Delays and blind spots increase operational risk in off-grid conditions.",
        icp: "Operators in remote industrial or underserved regions with basic connectivity but no autonomous logistics framework.",
        insight: "Autonomy matters most where infrastructure is weakest. Frontier logistics is often the core bottleneck, not the peripheral function.",
        solution: "EVA Frontier extends routing, telemetry, and ruggedized supply orchestration into remote zones. The platform converts disconnected movement into a measurable, resilient operating system.",
        motif: "frontier"
      },
      moon: {
        title: "EVA Moon",
        description: "Mission-grade retail and supply infrastructure for extreme environments.",
        problem: "Lunar EVA windows are limited, dangerous, and logistics remain highly manual. Regolith and terrain hazards degrade equipment and mission velocity.",
        icp: "NASA-aligned operators, CLPS providers, and lunar mission teams requiring autonomous staging and delivery infrastructure.",
        insight: "Mission-grade autonomy multiplies science output while reducing astronaut risk. Every minute saved from manual logistics compounds mission value.",
        solution: "EVA Moon integrates hazard-aware planning, mission telemetry, and autonomous supply node logic for planetary operations. It establishes a repeatable logistics layer for sustained surface activity.",
        motif: "moon"
      }
    };

    const APP = {
      view: "landing",
      env: "earth"
    };

    function setView(view) {
      APP.view = view;
      renderApp();
    }

    function setEnvironment(envKey) {
      APP.env = envKey;
      APP.view = "environment";
      renderApp();
    }

    function navButton(label, viewKey, active) {
      return `<button class="nav-btn ${active ? "is-active" : ""}" data-view="${viewKey}">${label}</button>`;
    }

    function topNav() {
      return `
        <nav class="top-nav" aria-label="SPA navigation">
          <div class="brand">EVA Systems, LLC</div>
          <div class="nav-items">
            ${navButton("Landing", "landing", APP.view === "landing")}
            ${navButton("Environment", "environment", APP.view === "environment")}
            ${navButton("Architecture", "architecture", APP.view === "architecture")}
            ${navButton("Scaling", "scaling", APP.view === "scaling")}
            ${navButton("Founder", "founder", APP.view === "founder")}
            ${navButton("Contact", "contact", APP.view === "contact")}
          </div>
        </nav>
      `;
    }

    function environmentCard(key, title, subtitle, motifClass) {
      return `
        <article class="select-card" data-env="${key}" role="button" tabindex="0" aria-label="Select ${title}">
          <div class="select-visual ${motifClass}">${visualNodes(key)}</div>
          <div class="select-phase">Core Environment</div>
          <div class="select-title-row">
            <h3 class="card-title">${title}</h3>
            <span class="select-status">Active</span>
          </div>
          <p class="select-card-copy">${subtitle}</p>
        </article>
      `;
    }

    function visualClassForEnvironment(theme) {
      if (theme === "earth") return "select-visual--earth";
      if (theme === "frontier") return "select-visual--frontier";
      return "select-visual--moon";
    }

    function visualNodes(theme) {
      if (theme === "earth") {
        return `
          <span class="select-visual-earth-light" style="left:38%;bottom:30%;"></span>
          <span class="select-visual-earth-light" style="left:53%;bottom:36%;height:7px;"></span>
          <span class="select-visual-earth-light" style="left:72%;bottom:34%;height:8px;"></span>
        `;
      }

      if (theme === "frontier") {
        return `
          <span class="select-visual-spike" style="left:28%;height:62px;"></span>
          <span class="select-visual-spike" style="left:46%;height:44px;"></span>
          <span class="select-visual-spike" style="left:68%;height:70px;"></span>
        `;
      }

      if (theme !== "moon") {
        return "";
      }

      return `
        <span class="select-visual-star" style="left:12%;top:16%;"></span>
        <span class="select-visual-star" style="left:36%;top:22%;"></span>
        <span class="select-visual-star" style="left:54%;top:18%;"></span>
        <span class="select-visual-star" style="left:73%;top:26%;"></span>
        <span class="select-visual-star" style="left:84%;top:14%;"></span>
        <span class="select-visual-dot" style="left:16%;top:24%;"></span>
        <span class="select-visual-dot small" style="left:58%;top:34%;"></span>
        <span class="select-visual-dot small" style="left:78%;top:14%;"></span>
      `;
    }

    function landingPage() {
      return `
        <section class="panel view">
          <div class="select-grid" aria-label="Select environment">
            ${environmentCard("earth", "EVA Earth", "Built environment operations", "select-visual--earth")}
            ${environmentCard("frontier", "EVA Frontier", "Remote and underserved operations", "select-visual--frontier")}
            ${environmentCard("moon", "EVA Moon", "Extreme mission operations", "select-visual--moon")}
          </div>
        </section>
      `;
    }

    function environmentPage() {
      const env = ENVIRONMENTS[APP.env];
      const headerThumbnails = {
        earth: {
          src: "https://copilot.microsoft.com/th/id/BCO.dfce8a03-11ac-471f-b87e-6985baf23e31.png?h=384",
          alt: "Multifamily EVA unit thumbnail"
        },
        frontier: {
          src: "https://copilot.microsoft.com/th/id/BCO.8c08ee4f-cb82-497a-a312-b428a5ef1fd2.png?h=384",
          alt: "EVA Frontier unit thumbnail"
        },
        moon: {
          src: "https://copilot.microsoft.com/th/id/BCO.52467522-1fc1-49e9-a96a-e9d65b19dc2e.png?h=384",
          alt: "EVA Moon unit thumbnail"
        }
      };

      const thumb = headerThumbnails[APP.env];
      const headerClass = thumb ? "cinematic-header cinematic-header--with-thumb" : "cinematic-header";
      const headerThumbMarkup = thumb
        ? `<img class="env-header-thumb" src="${thumb.src}" alt="${thumb.alt}" loading="lazy" />`
        : "";

      return `
        <section class="panel view">
          <div class="${headerClass}">
            <span class="kicker">${env.title}</span>
            <h1 class="cinematic-title">${env.title} Environment</h1>
            <p class="cinematic-sub">${env.description}</p>
            ${headerThumbMarkup}
          </div>

          <div class="env-layout">
            <article class="select-card env-preview-card" aria-hidden="true">
              <div class="select-visual ${visualClassForEnvironment(APP.env)}">${visualNodes(APP.env)}</div>
            </article>
            <div class="structured-grid">
              <article class="structured-item">
                <div class="structured-label">Problem</div>
                <p class="structured-copy">${env.problem}</p>
              </article>
              <article class="structured-item">
                <div class="structured-label">ICP</div>
                <p class="structured-copy">${env.icp}</p>
              </article>
              <article class="structured-item">
                <div class="structured-label">Insight</div>
                <p class="structured-copy">${env.insight}</p>
              </article>
              <article class="structured-item">
                <div class="structured-label">Solution</div>
                <p class="structured-copy">${env.solution}</p>
              </article>
            </div>
          </div>

          <div class="section-actions">
            <button class="btn-secondary" data-view="landing">Back to Landing</button>
            <button class="btn-primary" data-view="architecture">Next: Architecture</button>
          </div>
        </section>
      `;
    }

    function architecturePage() {
      return `
        <section class="panel view">
          <span class="kicker">Architecture</span>
          <h1 class="hero-title">Shared Core, Environment-Specific Execution</h1>
          <div class="diagram-placeholder">Diagram Placeholder</div>
          <p class="arch-list">
            Shared microservices run identity, orchestration, inventory, and policy controls across all deployments.
            Environment adapters translate those shared services into Earth, Frontier, and Moon operating constraints.
            Routing engines optimize pathing logic for each terrain profile while keeping a unified command model.
            Telemetry engines normalize signals into one visibility layer for operators and mission stakeholders.
          </p>
          <div class="section-actions">
            <button class="btn-secondary" data-view="environment">Back: Environment</button>
            <button class="btn-primary" data-view="scaling">Next: Scaling</button>
          </div>
        </section>
      `;
    }

    function scalingPage() {
      return `
        <section class="panel view">
          <span class="kicker">Scaling Path</span>
          <h1 class="hero-title">Earth to Frontier to Moon</h1>
          <div class="progression" aria-label="Scaling progression graphic">
            <article class="step">
              <div class="step-dot"></div>
              <h2 class="step-title">Earth</h2>
              <p class="step-copy">Prove throughput and repeat demand in structured, high-frequency zones.</p>
            </article>
            <article class="step">
              <div class="step-dot"></div>
              <h2 class="step-title">Frontier</h2>
              <p class="step-copy">Extend autonomy where infrastructure is sparse and movement risk is higher.</p>
            </article>
            <article class="step">
              <div class="step-dot"></div>
              <h2 class="step-title">Moon</h2>
              <p class="step-copy">Apply mission-grade logistics autonomy to extreme and planetary conditions.</p>
            </article>
          </div>
          <div class="section-actions">
            <button class="btn-secondary" data-view="architecture">Back: Architecture</button>
            <button class="btn-primary" data-view="founder">Next: Founder</button>
          </div>
        </section>
      `;
    }

    function founderPage() {
      return `
        <section class="panel view">
          <span class="kicker">Founder</span>
          <h1 class="hero-title">Founder-Led Execution</h1>
          <p class="founder-bio">
            Thomas J. Fanara is the founder and CEO of EVA Systems, LLC.
            He is building EVA as an infrastructure-first company that unifies retail, supply orchestration, and autonomy.
            The roadmap is intentionally staged: validate on Earth, scale through Frontier conditions, then extend into mission-grade environments.
          </p>
          <div class="section-actions">
            <button class="btn-secondary" data-view="scaling">Back: Scaling</button>
            <button class="btn-primary" data-view="contact">Next: Contact</button>
          </div>
        </section>
      `;
    }

    function contactPage() {
      return `
        <section class="panel view">
          <span class="kicker">Contact</span>
          <h1 class="hero-title">Contact EVA</h1>
          <p class="contact-copy">
            For investor, mission, and deployment conversations, contact EVA Systems directly.
          </p>
          <div class="section-actions">
            <a class="btn-primary" href="mailto:tom.fanara@eva-systems.net?subject=Contact%20EVA">Contact EVA</a>
            <button class="btn-secondary" data-view="landing">Back to Landing</button>
          </div>
        </section>
      `;
    }

    function activeViewMarkup() {
      if (APP.view === "landing") return landingPage();
      if (APP.view === "environment") return environmentPage();
      if (APP.view === "architecture") return architecturePage();
      if (APP.view === "scaling") return scalingPage();
      if (APP.view === "founder") return founderPage();
      return contactPage();
    }

    function attachHandlers(root) {
      root.querySelectorAll(".nav-btn, .btn-secondary, .btn-primary[data-view]").forEach((button) => {
        const view = button.getAttribute("data-view");
        if (!view) return;
        button.addEventListener("click", () => setView(view));
      });

      root.querySelectorAll("[data-env]").forEach((card) => {
        const onSelect = () => setEnvironment(card.getAttribute("data-env"));
        card.addEventListener("click", onSelect);
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            onSelect();
          }
        });
      });

    }

    function renderApp() {
      const app = document.getElementById("app");
      if (!app) return;

      document.body.classList.toggle("landing-focus", APP.view === "landing");

      app.innerHTML = `${topNav()}${activeViewMarkup()}`;
      attachHandlers(app);
    }

    renderApp();
  </script>
</body>
</html>
